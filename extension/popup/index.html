<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VibeCheck account</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-vc-component="Account & Inbox Popup">
  <main>
    <h1>VibeCheck</h1>
    <p class="lede" id="status">Local mode — comments stay in this browser until you connect Supabase.</p>

    <section>
      <h2>Display name</h2>
      <label>
        Used on local pins
        <input id="author" data-vc-component="Field" data-state="Default" type="text" placeholder="Your name">
      </label>
      <button id="save-author" data-vc-component="Button" data-style="Primary" data-state="Default" type="button">Save name</button>
    </section>

    <section>
      <h2>Supabase (Phase 6)</h2>
      <label>
        Project URL
        <input id="url" data-vc-component="Field" data-state="Default" type="url" placeholder="https://project.supabase.co">
      </label>
      <label>
        Anon key
        <input id="anon" data-vc-component="Field" data-state="Default" type="password" placeholder="Paste anon key">
      </label>
      <label>
        Allowed email domain
        <input id="domain" data-vc-component="Field" data-state="Default" type="text" placeholder="yourcompany.com">
      </label>
      <div class="row">
        <button id="save-config" data-vc-component="Button" data-style="Primary" data-state="Default" type="button">Save config</button>
        <button id="signin" data-vc-component="Button" data-style="Secondary" data-state="Default" type="button">Sign in with Google</button>
        <button id="signout" data-vc-component="Button" data-style="Secondary" data-state="Default" type="button" hidden>Sign out</button>
      </div>
    </section>

    <section>
      <h2>Toolbar role</h2>
      <label>
        Main toolbar variant
        <select id="toolbar-role" data-vc-component="Field" data-state="Default" aria-label="Toolbar role">
          <option value="Full">Full</option>
          <option value="PM Only">PM Only</option>
        </select>
      </label>
    </section>

    <section>
      <h2>Inbox</h2>
      <ul id="inbox"></ul>
    </section>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
