name: Publish VibeCheck landing page

on:
  push:
    branches:
      - main
      - codex/vibecheck-landing-exercise
    paths:
      - 'VibeCheck Landing page/**'
      - 'extension/toolbar/bundle.min.js'
      - 'extension/toolbar/bundle.css'
      - 'extension/tuts/**'
      - 'design-system/fonts/figtree/**'
      - '.github/workflows/landing-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep a running deployment intact; serialize updates to this one public site.
concurrency:
  group: vibecheck-landing-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/vibecheck-landing-exercise'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the website and canonical runtime assets
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test landing-page state
        run: npm --prefix 'VibeCheck Landing page' test
      - name: Build the public website
        run: npm --prefix 'VibeCheck Landing page' run build
      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@v6.0.0
      - name: Upload only the built website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 'VibeCheck Landing page/dist'
          retention-days: 1
          include-hidden-files: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
